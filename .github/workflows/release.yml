name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-disabled:
    name: Automatic package publishing disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain release policy
        run: |
          echo "Automated npm, GitHub Release, binary, and GHCR publishing is disabled for this fork."
          echo "This workflow intentionally does not publish packages or images."
