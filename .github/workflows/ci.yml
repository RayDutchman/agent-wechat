name: CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  # dorny/paths-filter reads the changed files of a pull request through the
  # pull request API.
  pull-requests: read

# Supersede older runs of the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ts:
              - 'packages/cli/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            rust:
              - 'packages/agent-server-rust/**'
              - 'packages/agent-server-rust/Cargo.lock'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (all packages)
        run: pnpm -r --if-present test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          toolchain: 1.93.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/agent-server-rust -> target
          add-rust-environment-hash-key: false
          key: rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('packages/agent-server-rust/Cargo.toml', 'packages/agent-server-rust/Cargo.lock') }}

      - name: Cargo check
        run: cargo check --locked --manifest-path packages/agent-server-rust/Cargo.toml

      - name: Cargo test
        run: cargo test --locked --manifest-path packages/agent-server-rust/Cargo.toml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @agent-wechat/docs

      - name: Build docs
        run: pnpm --filter @agent-wechat/docs build
