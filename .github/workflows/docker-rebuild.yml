name: Docker Rebuild

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 0.2.2); normal builds also update :latest."
        required: true
      no-cache:
        description: "Skip Docker layer cache"
        type: boolean
        default: false
      existing_digest:
        description: "Verify and publish an existing amd64 image digest instead of building"
        type: string
        required: false
        default: ""

concurrency: docker-rebuild

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: inputs.existing_digest == ''
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned WeChat package
        env:
          WECHAT_ARCH: ${{ matrix.arch }}
          WECHAT_DEB_AMD64_URL: ${{ vars.WECHAT_DEB_AMD64_URL }}
          WECHAT_DEB_ARM64_URL: ${{ vars.WECHAT_DEB_ARM64_URL }}
        run: bash scripts/download-wechat.sh

      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src docker/agent-server-rust/
          cp -r packages/agent-server-rust/migrations docker/agent-server-rust/

      - uses: docker/setup-buildx-action@v4.4.1

      # The registry path has to be lowercase; the repository name keeps the
      # owner casing from GitHub.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          no-cache: ${{ inputs.no-cache }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # The uploaded digest is the artifact the release manifest points at, so
      # the smoke test runs against that exact digest and not against a second
      # build of the same source. The versioned and latest tags are only
      # created in the manifest job, which runs after this check passed.
      - name: Smoke test the uploaded image digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          bash scripts/smoke-image-startup.sh "$IMAGE_REF"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: inputs.existing_digest == ''
    name: Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4.4.1

      # Same lowercase registry path as the build job.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          refs=()
          for digest in /tmp/digests/*; do refs+=("${IMAGE}@sha256:${digest##*/}"); done
          # One digest per architecture, both of them smoke tested.
          test "${#refs[@]}" = 2
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"

  publish-existing-amd64:
    name: Verify and publish existing amd64 image
    if: inputs.existing_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate digest and version
        env:
          DIGEST: ${{ inputs.existing_digest }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid sha256 digest" >&2; exit 1; }
          [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}-amd64$ ]] || { echo "Version must be a safe tag ending in -amd64" >&2; exit 1; }

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Pull and verify exact amd64 digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ inputs.existing_digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE}@${DIGEST}"
          docker pull --platform linux/amd64 "$REF"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF")" == "linux/amd64" ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "$REF")" == "$GITHUB_SHA" ]]
          docker run --rm --network none --entrypoint bash "$REF" -ceu '
            test "$(dpkg-query -W -f="\${Version}" wechat)" = 4.1.13.23
            readelf -n /opt/wechat/wechat | grep -F "Build ID: ce28c3471d532eeb1f136482eeb4d0bdfd59c06e"
          '
          bash scripts/smoke-image-startup.sh "$REF"

      - name: Publish verified amd64 version tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ inputs.existing_digest }}
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools create --prefer-index=false -t "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"

      - name: Record verified digest
        env:
          DIGEST: ${{ inputs.existing_digest }}
          VERSION: ${{ inputs.version }}
        run: echo "Published ${VERSION} from verified digest ${DIGEST} (amd64 only; latest unchanged)." >> "$GITHUB_STEP_SUMMARY"
