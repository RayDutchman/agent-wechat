name: Python tools

on:
  pull_request:
    paths:
      - 'docker/tools/**.py'
      - 'docker/tools/media-download.js'
      - 'tests/test_*.py'
      - 'tests/media-download.test.cjs'
      - '.github/workflows/python-tools.yml'

permissions:
  contents: read

# Supersede older runs of the same pull request.
concurrency:
  group: python-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # SQLCipher 4 integration is additionally exercised in research containers.
      - run: python3 -m unittest discover -s tests -v
      - run: python3 docker/tools/test_a11y_dump.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/media-download.test.cjs
